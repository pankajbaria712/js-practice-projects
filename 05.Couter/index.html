<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Counter App</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1>Counter App</h1>
      <div class="container">
        <div class="cards" id="card-1">
          <!-- Mouse Move Counter -->
          <h4>Mouse Move Counter</h4>
          <p>This is tracker your mouse movement 🖱️</p>
          <h2>X : <span>0</span> Y: <span>0</span></h2>
        </div>
        <div class="cards" id="card-2">
          <!-- Number counter -->
          <h4>Number Counter</h4>
          <p>This is couter, check using Increment(➕) & Decrement(➖)</p>
          <h2>0</h2>
          <div class="buttons">
            <button id="inc">Increment</button>
            <button id="dec">Decrement</button>
          </div>
        </div>
        <div class="cards" id="card-3">
          <!-- Click Counter  -->
          <h4>Click Counter</h4>
          <p>This counter track your mouse click 🖱️</p>
          <h2>0</h2>
        </div>
        <div class="cards" id="card-4">
          <!-- Key-Down Counter  -->
          <h4>Key-Down Counter</h4>
          <p>This counter track your keyboard Key-Down ⌨️</p>
          <h2>0</h2>
        </div>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
